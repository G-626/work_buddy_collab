# CaseCraft — Session Agent Loop skill manifest (WorkBuddy custom skill)
# Format per WorkBuddy docs: "skill.yml — Metadata, description, and configuration"
# Full agent workflow lives in SKILL.md (the brain); this file is the config + entry.

name: session
display_name: "session"
display_name_en: "session"
version: 1.0.0
homepage: https://github.com/G-626/work_buddy_collab
icon: "https://www.google.com/s2/favicons?domain=github.com&sz=256"
visibility: public

description: >
  Run CaseCraft's Session Agent Loop — ingest a capture package (transcript.md +
  capture.md, observables only), draft a structured session summary, hold the
  human review gate (therapist edits/approves — nothing merges without it),
  write the passport delta (versioned) and regenerate stakeholder views.
description_zh: "执行 CaseCraft 会话智能循环：摄入捕获包（转录+可观测事件），生成结构化会话摘要，人工审核关卡（治疗师确认后才合并），更新护照增量与相关视图"
description_en: "Run CaseCraft's Session Agent Loop — ingest capture package, draft summary, human review gate, passport delta, regenerate views."

allowed-tools:
  - Read
  - Write
  - Bash

requires:
  runtime: "python3"
  tools:
    - casecraft/tools/transcribe.py   # local Whisper: audio -> transcript.md (real media)
    - casecraft/tools/dryrun.py       # Level-1 deterministic replay (demo)
    - casecraft/tools/pdfrender.py    # styled PDF export

files:
  - SKILL.md                          # full agent workflow (the brain)
  - templates/patterns.md             # movement-event -> Patterns engine
  - ../commands/session.md            # /session slash surface

workflow:
  inputs:
    - capture_package: "students/<id>/sessions/<date>-<slug>/transcript.md + capture.md"
    - goal: "session goal set by the therapist (e.g. --goal=\"ask for help when unsure\")"
  steps:
    - "Locate the capture package for the student + session date (or ask the user for the folder)."
    - "Optional real media: run tools/transcribe.py on the session audio (local Whisper, nothing leaves the machine)."
    - "Draft the structured session summary from the capture package — observables only."
    - "HOLD the review gate: present the draft, the therapist edits or approves (~90 s)."
    - "On approval: compute the passport delta (v1.0 -> v1.1), update the passport."
    - "Regenerate views (Teacher Guide, Parent Report, Social Story, Therapist Summary) + linter report."
    - "Read feedback-summary.md + session-hypothesis.md (if present) at session start to close the learning loop."
  outputs:
    - "students/<id>/passport.md (versioned delta)"
    - "dryrun/<student>/<session>/: 01-session-draft, 02-review-gate, 03-passport-v1.1, 05-linter-report"
    - "views/ (4 .md + 5 PDFs)"
  principles:
    - "Observables only — never emotional inference (ADR-0005)."
    - "Human-in-the-loop — nothing merges without professional approval."
    - "Fictional demo data only in examples; real use is pseudonymised."
